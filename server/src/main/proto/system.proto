syntax = "proto3";

package actiongame.protocol;

option java_package = "com.actiongame.server.proto";
option java_outer_classname = "SystemProto";

// 心跳请求
message HeartbeatReq {
  int32 protocol_version = 1;
  int64 timestamp = 2;
  string player_id = 3;
}

// 心跳响应 (包含往返延迟)
message HeartbeatResp {
  int32 protocol_version = 1;
  int64 server_timestamp = 2;
  int64 client_timestamp = 3;
  int32 rtt = 4;  // round-trip time in ms
}
