apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-server
  namespace: actiongame
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/part-of: actiongame
spec:
  rules:
    - host: game-server-0.example.com
      http:
        paths:
          - path: /game
            pathType: Prefix
            backend:
              service:
                name: game-server-node-0
                port:
                  number: 9090
    - host: game-server-1.example.com
      http:
        paths:
          - path: /game
            pathType: Prefix
            backend:
              service:
                name: game-server-node-1
                port:
                  number: 9090
    - host: game-server-2.example.com
      http:
        paths:
          - path: /game
            pathType: Prefix
            backend:
              service:
                name: game-server-node-2
                port:
                  number: 9090
