apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-server
  namespace: actiongame
  labels:
    app.kubernetes.io/name: game-server
    app.kubernetes.io/part-of: actiongame
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: game-server
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
