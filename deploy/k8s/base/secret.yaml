apiVersion: v1
kind: Secret
metadata:
  name: game-server-secrets
  namespace: actiongame
  labels:
    app.kubernetes.io/part-of: actiongame
type: Opaque
stringData:
  # Demo credentials. Replace these before deploying outside a local cluster.
  MATCH_DB_URL: "jdbc:mysql://mysql:3306/actiongame?useSSL=false&serverTimezone=UTC"
  MATCH_DB_USER: "root"
  MATCH_DB_PASSWORD: "actiongame"
  AUTH_TOKEN: ""
  REDIS_PASSWORD: ""
