apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: game-server
  namespace: actiongame
spec:
  template:
    spec:
      containers:
        - name: game-server
          image: actiongame-server:dev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
